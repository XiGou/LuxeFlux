# 将 H5 版本自动部署到 GitHub Pages
#
# 前置设置（只需一次，在 GitHub 仓库页面操作）：
#   Settings → Pages → Build and deployment → Source 选择 "GitHub Actions"
#
# 触发方式：
#   - push 到 main 分支：自动构建并发布
#   - 也可在 Actions 页面手动 Run workflow（workflow_dispatch）
#
# 部署地址：https://<owner>.github.io/<repo>/
#   项目页挂在 /<repo>/ 子路径下，因此构建时注入 BASE_PATH=/<repo>/，
#   保证 JS/CSS、PWA 清单、Service Worker scope 全部落在子路径内。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 最小权限：读代码 + 写 Pages + 申请 OIDC token
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个 Pages 部署；新 push 不打断正在进行的发布，只取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Logic smoke test
        run: npm test

      - name: Build
        # BASE_PATH 让产物适配 https://<owner>.github.io/<repo>/ 子路径
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Disable Jekyll
        # 避免 GitHub Pages 用 Jekyll 处理产物，跳过带下划线前缀的文件
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
